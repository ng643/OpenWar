# OpenWar public entry point - HTTP + HTTPS.
# Installed to /etc/nginx/sites-available/openwar, symlinked into sites-enabled.
# TLS cert: Let's Encrypt IP-address certificate (shortlived profile, 6 day validity)
#   /etc/letsencrypt/live/130.162.162.132/{fullchain,privkey}.pem
# Renewal: certbot-renew.timer -> certbot renew --webroot -> deploy-hook "systemctl reload nginx"
# Static client: /opt/openwar/current/dist (release symlink); missing files fall back to the
# game server on 127.0.0.1:8080, which serves its own dist/ and answers the /ws WebSocket.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 130.162.162.132 _;

    # ACME http-01 challenge webroot - must stay reachable over plain HTTP for renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/openwar-acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;   # nginx 1.18 syntax (Ubuntu 22.04); "http2 on;" needs >=1.25
    listen [::]:443 ssl http2 default_server;
    server_name 130.162.162.132 _;

    ssl_certificate       /etc/letsencrypt/live/130.162.162.132/fullchain.pem;
    ssl_certificate_key   /etc/letsencrypt/live/130.162.162.132/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/130.162.162.132/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling off;            # short-lived/IP certs: no OCSP

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    root /opt/openwar/current/dist;
    charset utf-8;

    # Hashed build assets - long lived, served from disk when the release ships a dist/.
    location ~* \.(?:js|css|mjs|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|ico|map|wasm)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri @app;
    }

    # Entry document - never cached, so a new release is picked up immediately.
    location = /index.html {
        try_files /index.html @app;
        add_header Cache-Control "no-store" always;
    }

    location = / {
        try_files /index.html @app;
        add_header Cache-Control "no-store" always;
    }

    # Static-first, backend fallback (the game server also serves dist/ itself).
    location / {
        try_files $uri @app;
    }

    # Game WebSocket (authoritative server, loopback only).
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Local-only health probe.
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
    }

    location @app {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
