# OpenWar public entry point - HTTP/ACME stage (used for certificate issuance only).
# Installed to /etc/nginx/sites-available/openwar, symlinked into sites-enabled.
# Ownership: root:root 0644. Reload with: nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 130.162.162.132 _;

    # ACME http-01 challenge webroot (certbot --webroot --webroot-path /var/www/openwar-acme)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/openwar-acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        add_header Content-Type text/plain always;
        return 200 "openwar: http/1.1 challenge endpoint\n";
    }
}
